spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

openai:
  key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  api:
    url: https://api.openai.com/v1/chat/completions
