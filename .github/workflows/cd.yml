name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "build/libs/*.jar"
          target: "/opt/routiner"
          strip_components: 2

      - name: Restart server
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            key: ${{ secrets.EC2_SSH_KEY }}
            port: ${{ secrets.EC2_PORT }}
            envs: DB_URL,DB_USERNAME,DB_PASSWORD
            script: |
              cd /opt/routiner
              # jar 파일명 통일
              mv *.jar app.jar 2>/dev/null || true
              
              # 환경변수 파일 생성
              sudo tee /opt/routiner/.env << ENVEOF
              DB_URL=${{ secrets.DB_URL }}
              DB_USERNAME=${{ secrets.DB_USERNAME }}
              DB_PASSWORD=${{ secrets.DB_PASSWORD }}
              ENVEOF
              
              # 서비스 파일에 환경변수 반영
              sudo tee /etc/systemd/system/routiner.service << SVCEOF
              [Unit]
              Description=Routiner Spring Boot App
              After=network.target
              
              [Service]
              User=ubuntu
              WorkingDirectory=/opt/routiner
              Environment="DB_URL=${{ secrets.DB_URL }}"
              Environment="DB_USERNAME=${{ secrets.DB_USERNAME }}"
              Environment="DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
              ExecStart=/usr/bin/java -jar /opt/routiner/app.jar
              Restart=always
              RestartSec=5
              
              [Install]
              WantedBy=multi-user.target
              SVCEOF
              
              sudo systemctl daemon-reload
              sudo systemctl restart routiner
              sleep 10
              sudo systemctl status routiner